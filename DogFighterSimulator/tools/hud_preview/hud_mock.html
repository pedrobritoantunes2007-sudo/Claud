<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: 'Fredoka One'; src: url(fonts/FredokaOne.woff2) format('woff2'); }
@font-face { font-family: 'Luckiest Guy'; src: url(fonts/LuckiestGuy.woff2) format('woff2'); }
:root { --ink: #1b1430; }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #9fd4f0; }
#stage { position: relative; width: 100vw; height: 100vh; background-size: cover; background-position: center; overflow: hidden; }
.abs { position: absolute; box-sizing: border-box; }
.fred { font-family: 'Fredoka One', sans-serif; color: #fff; paint-order: stroke fill; white-space: nowrap; }
.lucky { font-family: 'Luckiest Guy', sans-serif; color: #fff; paint-order: stroke fill; white-space: nowrap; letter-spacing: 0.02em; }
.panel { background: linear-gradient(#3a2f63, #241c40); border: var(--b) solid var(--ink); border-radius: var(--r); box-shadow: 0 var(--sh) 0 var(--ink); }
.glow { box-shadow: 0 var(--sh) 0 var(--ink), inset 0 calc(var(--b) * 0.9) 0 rgba(255, 255, 255, 0.38); }
.btn { border: var(--b) solid var(--ink); border-radius: var(--r); box-shadow: 0 var(--sh) 0 var(--ink); }
.bar { background: rgba(10, 6, 24, 0.55); border: calc(var(--b) * 0.75) solid var(--ink); border-radius: 999px; overflow: hidden; }
.fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; }
.fill::after { content: ''; position: absolute; left: 6%; right: 6%; top: 14%; height: 26%; border-radius: 999px; background: rgba(255, 255, 255, 0.35); }
.center { display: flex; align-items: center; justify-content: center; }
.badge { background: #ff4b4b; border: calc(var(--b) * 0.8) solid var(--ink); border-radius: 999px; }
.roblox { background: rgba(20, 20, 24, 0.55); border-radius: 10px; }
.note { font-family: 'Fredoka One', sans-serif; color: #fff; background: rgba(15, 10, 30, 0.82); border: 2px dashed #ffd84a; border-radius: 10px; }
</style></head>
<body><div id="stage"></div>
<script type="module">
import * as THREE from './three.module.min.js';

const QS = new URLSearchParams(location.search);
const MODE = QS.get('mode') || 'pc';
const THEME = QS.get('theme') || 'escuro';
// A = escuro (painéis roxo-escuro) · B = claro (painéis brancos) · C = colorido (cada painel com a sua cor, contorno grosso)
const THEMES = {
  escuro: { panel: {}, def: 'linear-gradient(#3a2f63, #241c40)', muted: '#c9c1e6', b: 4, glow: false },
  claro: { panel: {}, def: 'linear-gradient(#ffffff, #ddd5ff)', muted: '#5f539a', b: 4, glow: false },
  colorido: { panel: { card: 'linear-gradient(#62b6ff, #2b6bd4)', team: 'linear-gradient(#78e46e, #2c9a40)', quests: 'linear-gradient(#52dfd5, #1c958f)', goal: 'linear-gradient(#ffc566, #ee7f1c)', toast: 'linear-gradient(#b991ff, #6e40dc)' }, def: 'linear-gradient(#62b6ff, #2b6bd4)', muted: '#f2f6ff', b: 5, glow: true },
};
const TH = THEMES[THEME];
const bgOf = (kind) => TH.panel[kind] || TH.def;
const PHONE = MODE === 'phone';
const stage = document.getElementById('stage');
stage.style.backgroundImage = `url(bg_${PHONE ? 'phone' : 'pc'}.png)`;
const W = window.innerWidth, H = window.innerHeight;
// medidas base (PC 1080p = 1; celular = tudo menor)
const k = PHONE ? 0.5 : 1;
stage.style.setProperty('--b', (PHONE ? TH.b * 0.62 : TH.b) + 'px');
stage.style.setProperty('--sh', (PHONE ? 3 : 5) + 'px');
stage.style.setProperty('--r', (PHONE ? 12 : 20) + 'px');

//////////////////////////////////////////////////////////// 3D (ícones e cachorro)
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setPixelRatio(1);

function wedgeGeometry(w, h, l) {
  const x = w / 2, y = h / 2, z = l / 2;
  const A = [-x, -y, -z], B = [x, -y, -z], C = [-x, -y, z], D = [x, -y, z], E = [-x, y, z], F = [x, y, z];
  const tris = [A, C, D, A, D, B, C, E, F, C, F, D, A, B, F, A, F, E, A, E, C, B, D, F];
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(tris.flat(), 3));
  g.computeVertexNormals();
  return g;
}
const mat = (hex, o = {}) => o.neon ? new THREE.MeshBasicMaterial({ color: hex })
  : new THREE.MeshStandardMaterial({ color: hex, roughness: o.r ?? 0.62, metalness: o.m ?? 0, flatShading: !!o.flat, side: o.ds ? THREE.DoubleSide : THREE.FrontSide });
function add(g, geo, hex, p = [0, 0, 0], r = [0, 0, 0], o) {
  const m = new THREE.Mesh(geo, mat(hex, o)); m.position.set(...p); m.rotation.set(...r); g.add(m); return m;
}
const Bx = (w, h, d) => new THREE.BoxGeometry(w, h, d);
const Cy = (r, h, s = 36) => new THREE.CylinderGeometry(r, r, h, s);
const Co = (r, h, s = 28) => new THREE.ConeGeometry(r, h, s);
const Sp = (r, s = 28) => new THREE.SphereGeometry(r, s, Math.round(s * 0.75));
const Eg = (rx, ry, rz) => { const g = new THREE.SphereGeometry(1, 30, 22); g.scale(rx, ry, rz); return g; };
const We = (w, h, l) => wedgeGeometry(w, h, l);
const GOLD = { m: 0.35, r: 0.35 };
const PI = Math.PI;

const ICONS = {
  coins() {
    const g = new THREE.Group();
    for (let i = 0; i < 4; i++) {
      const x = [0, 0.07, -0.05, 0.04][i], z = [0, 0.05, 0.02, -0.03][i];
      add(g, Cy(1, 0.3), 0xf6c22e, [x, i * 0.32, z], [0, 0, 0], GOLD);
      add(g, Cy(0.74, 0.32), 0xe09a17, [x, i * 0.32, z], [0, 0, 0], GOLD);
    }
    add(g, Cy(1, 0.28), 0xffd34d, [1.25, 0.6, 0.6], [PI / 2, 0, 0.3], GOLD);
    add(g, Cy(0.72, 0.3), 0xe8a51a, [1.25, 0.6, 0.6], [PI / 2, 0, 0.3], GOLD);
    add(g, Bx(0.18, 0.6, 0.32), 0xffe27a, [1.25, 0.6, 0.6], [PI / 2, 0, 0.3], GOLD);
    return g;
  },
  doghouse() {
    const g = new THREE.Group();
    add(g, Bx(2, 1.5, 2.1), 0xffa94a, [0, 0.75, 0]);
    add(g, Bx(2.1, 0.22, 2.2), 0xe8913a, [0, 0.11, 0]);
    add(g, We(2.4, 1.15, 1.3), 0xe8453c, [0.64, 2.07, 0], [0, -PI / 2, 0]);
    add(g, We(2.4, 1.15, 1.3), 0xd63a33, [-0.64, 2.07, 0], [0, PI / 2, 0]);
    add(g, Bx(0.78, 0.8, 0.12), 0x2c1d17, [0, 0.5, 1.05]);
    add(g, Cy(0.39, 0.12), 0x2c1d17, [0, 0.9, 1.05], [PI / 2, 0, 0]);
    add(g, Bx(0.9, 0.24, 0.1), 0xfff1d0, [0, 1.42, 1.07]);
    add(g, Cy(0.34, 0.22), 0x4aa8ff, [0.95, 0.12, 1.45]);
    add(g, Cy(0.26, 0.04), 0xc9853f, [0.95, 0.23, 1.45]);
    return g;
  },
  dog() {
    const g = new THREE.Group();
    const tan = 0xdc9d5e, light = 0xf3cf95, dark = 0x8a5a33;
    add(g, Bx(1.55, 1.3, 1.3), tan, [0, 0, 0]);
    add(g, Bx(0.86, 0.56, 0.62), light, [0, -0.28, 0.82]);
    add(g, Bx(0.36, 0.24, 0.2), 0x1d1418, [0, -0.06, 1.16]);
    for (const s of [-1, 1]) {
      add(g, Bx(0.22, 0.3, 0.08), 0x1d1418, [s * 0.34, 0.2, 0.66]);
      add(g, Bx(0.08, 0.09, 0.03), 0xffffff, [s * 0.34 - 0.04, 0.27, 0.71]);
      add(g, Bx(0.42, 0.78, 0.26), dark, [s * 0.86, 0.2, -0.05], [0, 0, s * 0.35]);
    }
    add(g, Bx(0.26, 0.07, 0.3), 0xff6f8f, [0.06, -0.6, 0.98]);
    add(g, Bx(1.6, 0.22, 1.36), 0xe8453c, [0, -0.74, 0]);
    add(g, Sp(0.15), 0xffd34d, [0, -0.86, 0.7], [0, 0, 0], GOLD);
    return g;
  },
  egg() {
    const g = new THREE.Group();
    add(g, Cy(0.85, 0.32), 0xffc83a, [0, 0.16, 0], [0, 0, 0], GOLD);
    add(g, Eg(0.86, 1.15, 0.86), 0xfff3d9, [0, 1.35, 0]);
    const spots = [[0.35, 1.7, 0.7, 0x5fc6ff], [-0.45, 1.25, 0.66, 0xff9a4a], [0.55, 1.0, 0.58, 0xff6eb4], [-0.1, 2.05, 0.55, 0x8de36a], [0.05, 1.05, 0.83, 0x5fc6ff]];
    for (const [x, y, z, c] of spots) {
      const m = add(g, Eg(0.17, 0.17, 0.05), c, [x, y, z]);
      m.lookAt(new THREE.Vector3(x * 3, (y - 1.35) * 3 + 1.35, z * 3));
    }
    return g;
  },
  map() {
    const g = new THREE.Group();
    const paper = [0xf6e3b3, 0xefd8a2, 0xf6e3b3];
    for (let i = 0; i < 3; i++) add(g, Bx(0.95, 1.9, 0.07), paper[i], [(i - 1) * 0.92, 0, i === 1 ? -0.12 : 0], [0, i === 1 ? 0 : (i === 0 ? 0.28 : -0.28), 0]);
    add(g, Eg(0.55, 0.42, 0.04), 0x69c94e, [-0.05, 0.25, -0.06]);
    add(g, Eg(0.2, 0.16, 0.04), 0x4aa8ff, [-0.25, -0.45, -0.06]);
    for (let i = 0; i < 4; i++) add(g, Bx(0.13, 0.06, 0.04), 0xe8453c, [0.18 + i * 0.16, -0.25 - i * 0.1, i > 1 ? 0.0 : -0.07]);
    add(g, Bx(0.42, 0.08, 0.05), 0xe8453c, [0.9, -0.6, 0.06], [0, -0.28, 0.75]);
    add(g, Bx(0.42, 0.08, 0.05), 0xe8453c, [0.9, -0.6, 0.06], [0, -0.28, -0.75]);
    return g;
  },
  tower() {
    const g = new THREE.Group();
    add(g, Cy(0.85, 2.2), 0xb9b3cc, [0, 1.1, 0]);
    for (let i = 0; i < 6; i++) { const a = i / 6 * PI * 2; add(g, Bx(0.32, 0.32, 0.32), 0xa49dba, [Math.cos(a) * 0.82, 2.35, Math.sin(a) * 0.82], [0, -a, 0]); }
    add(g, Co(0.95, 1.05), 0x8e5cff, [0, 2.95, 0]);
    add(g, Cy(0.04, 0.8), 0x5a4a3a, [0, 3.75, 0]);
    add(g, Bx(0.55, 0.32, 0.04), 0xff4b4b, [0.3, 3.95, 0]);
    add(g, Bx(0.5, 0.7, 0.1), 0x2c1d24, [0, 0.35, 0.83]);
    add(g, Cy(0.25, 0.1), 0x2c1d24, [0, 0.7, 0.83], [PI / 2, 0, 0]);
    add(g, Bx(0.2, 0.3, 0.1), 0xffd34d, [0.38, 1.55, 0.76], [0, 0.45, 0], { neon: true });
    add(g, Bx(0.2, 0.3, 0.1), 0xffd34d, [-0.38, 1.55, 0.76], [0, -0.45, 0], { neon: true });
    return g;
  },
  gift() {
    const g = new THREE.Group();
    add(g, Bx(1.6, 1.25, 1.6), 0xff5fa8, [0, 0.62, 0]);
    add(g, Bx(1.76, 0.36, 1.76), 0xf04d97, [0, 1.38, 0]);
    add(g, Bx(0.3, 1.27, 1.62), 0xffc83a, [0, 0.62, 0], [0, 0, 0], GOLD);
    add(g, Bx(1.62, 1.27, 0.3), 0xffc83a, [0, 0.62, 0], [0, 0, 0], GOLD);
    add(g, Bx(0.32, 0.38, 1.78), 0xffd34d, [0, 1.38, 0], [0, 0, 0], GOLD);
    add(g, Bx(1.78, 0.38, 0.32), 0xffd34d, [0, 1.38, 0], [0, 0, 0], GOLD);
    add(g, Eg(0.42, 0.26, 0.2), 0xffd34d, [-0.33, 1.72, 0], [0, 0, 0.55], GOLD);
    add(g, Eg(0.42, 0.26, 0.2), 0xffd34d, [0.33, 1.72, 0], [0, 0, -0.55], GOLD);
    add(g, Sp(0.15), 0xffb81c, [0, 1.66, 0.04], [0, 0, 0], GOLD);
    return g;
  },
  scroll() {
    const g = new THREE.Group();
    add(g, Bx(1.45, 1.7, 0.06), 0xf6e7c1, [0, 0, 0]);
    for (const y of [0.92, -0.92]) {
      add(g, Cy(0.18, 1.75), 0xd6b27a, [0, y, 0.05], [0, 0, PI / 2]);
      for (const x of [-0.95, 0.95]) add(g, Cy(0.13, 0.16), 0x8a5a33, [x, y, 0.05], [0, 0, PI / 2]);
    }
    for (let i = 0; i < 3; i++) add(g, Bx(0.75, 0.08, 0.03), 0x9a8566, [-0.22, 0.45 - i * 0.32, 0.05]);
    add(g, Bx(0.16, 0.36, 0.06), 0x45c94e, [0.36, -0.42, 0.08], [0, 0, 0.75]);
    add(g, Bx(0.16, 0.62, 0.06), 0x45c94e, [0.55, -0.28, 0.08], [0, 0, -0.6]);
    add(g, Cy(0.16, 0.08), 0xd8323a, [-0.4, -0.45, 0.06], [PI / 2, 0, 0]);
    return g;
  },
  trade() {
    const g = new THREE.Group();
    const arrow = (y, dir, c) => {
      add(g, Bx(1.25, 0.34, 0.34), c, [-dir * 0.15, y, 0]);
      add(g, We(0.34, 0.42, 0.42), c, [dir * 0.62, y + 0.21, 0], [0, -dir * PI / 2, PI]);
      add(g, We(0.34, 0.42, 0.42), c, [dir * 0.62, y - 0.21, 0], [0, -dir * PI / 2, 0]);
    };
    arrow(0.36, 1, 0x4aa8ff);
    arrow(-0.36, -1, 0xff9a2e);
    return g;
  },
  key() {
    const g = new THREE.Group();
    add(g, Cy(0.55, 0.22), 0xffc83a, [-0.7, 0, 0], [PI / 2, 0, 0], GOLD);
    add(g, Cy(0.26, 0.24), 0x7a5410, [-0.7, 0, 0], [PI / 2, 0, 0]);
    add(g, Bx(1.35, 0.24, 0.2), 0xffc83a, [0.35, 0, 0], [0, 0, 0], GOLD);
    add(g, Bx(0.2, 0.38, 0.2), 0xffc83a, [0.85, -0.25, 0], [0, 0, 0], GOLD);
    add(g, Bx(0.2, 0.26, 0.2), 0xffc83a, [0.55, -0.2, 0], [0, 0, 0], GOLD);
    return g;
  },
  gear() {
    const g = new THREE.Group();
    add(g, Cy(0.78, 0.36), 0x9aa7c7, [0, 0, 0], [PI / 2, 0, 0], { m: 0.3, r: 0.4 });
    for (let i = 0; i < 8; i++) { const a = i / 8 * PI * 2; add(g, Bx(0.34, 0.34, 0.36), 0x8a97b8, [Math.cos(a) * 0.86, Math.sin(a) * 0.86, 0], [0, 0, a], { m: 0.3, r: 0.4 }); }
    add(g, Cy(0.26, 0.38), 0x3a3550, [0, 0, 0], [PI / 2, 0, 0]);
    return g;
  },
  boss() {
    const g = new THREE.Group();
    add(g, Sp(1), 0x3b2458, [0, 0, 0]);
    for (const s of [-1, 1]) {
      add(g, Bx(0.36, 0.14, 0.1), 0xff3030, [s * 0.36, 0.2, 0.93], [0, 0, -s * 0.38], { neon: true });
      add(g, Co(0.22, 0.75), 0xf2e8d5, [s * 0.62, 0.92, 0], [0, 0, -s * 0.55]);
    }
    add(g, Bx(0.86, 0.18, 0.12), 0x14081f, [0, -0.36, 0.92]);
    for (const x of [-0.25, 0, 0.25]) add(g, Co(0.07, 0.16), 0xffffff, [x, -0.34, 0.98], [PI, 0, 0]);
    return g;
  },
  island() {
    const g = new THREE.Group();
    add(g, Cy(1.3, 0.34), 0x6fd35a, [0, 0, 0]);
    add(g, Cy(1.32, 0.18), 0x9b6a3c, [0, -0.25, 0]);
    add(g, Co(1.25, 1.2), 0x8a5a33, [0, -0.94, 0], [PI, 0, 0]);
    add(g, Cy(0.08, 0.5), 0x7a5230, [0.5, 0.42, -0.2]);
    add(g, Sp(0.42), 0x4fbf45, [0.5, 0.86, -0.2]);
    add(g, Bx(0.55, 0.4, 0.5), 0xfff0d6, [-0.45, 0.37, 0.25]);
    add(g, We(0.6, 0.3, 0.32), 0xe8453c, [-0.45 + 0.15, 0.72, 0.25], [0, -PI / 2, 0]);
    add(g, We(0.6, 0.3, 0.32), 0xd63a33, [-0.45 - 0.15, 0.72, 0.25], [0, PI / 2, 0]);
    return g;
  },
  paw() {
    const g = new THREE.Group();
    add(g, Eg(0.62, 0.52, 0.2), 0xff8fb8, [0, -0.25, 0]);
    const toes = [[-0.62, 0.32], [-0.22, 0.62], [0.22, 0.62], [0.62, 0.32]];
    for (const [x, y] of toes) add(g, Eg(0.22, 0.26, 0.18), 0xff8fb8, [x, y, 0]);
    return g;
  },
  target() {
    const g = new THREE.Group();
    const rings = [[1, 0xe8453c], [0.76, 0xffffff], [0.52, 0xe8453c], [0.28, 0xffd34d]];
    rings.forEach(([r, c], i) => add(g, Cy(r, 0.2), c, [0, 0, i * 0.03], [PI / 2, 0, 0]));
    add(g, Cy(0.05, 1.3), 0x7a5230, [0.38, 0.38, 0.45], [0.75, 0, -0.75]);
    add(g, We(0.04, 0.3, 0.3), 0x4aa8ff, [0.78, 0.78, 0.85], [0, 0.75, 0], { ds: true });
    return g;
  },
  heart() {
    const g = new THREE.Group();
    add(g, Sp(0.5), 0xff4b5c, [-0.34, 0.22, 0]);
    add(g, Sp(0.5), 0xff4b5c, [0.34, 0.22, 0]);
    add(g, Bx(0.86, 0.86, 0.74), 0xff4b5c, [0, -0.16, 0], [0, 0, PI / 4]);
    add(g, Sp(0.14), 0xffffff, [-0.42, 0.42, 0.38]);
    return g;
  },
  fang() {
    // boca aberta: gengiva de cima e de baixo com dentes (2 presas grandes em cima)
    const g = new THREE.Group();
    add(g, Bx(1.7, 0.42, 0.6), 0xe8456a, [0, 0.62, 0], [0.18, 0, 0]);
    add(g, Bx(1.5, 0.36, 0.55), 0xd63a5c, [0, -0.62, 0.05], [-0.18, 0, 0]);
    add(g, Bx(1.3, 0.9, 0.2), 0x5a1430, [0, 0, -0.18]);
    for (const [x, r, h] of [[-0.55, 0.19, 0.72], [0.55, 0.19, 0.72], [-0.2, 0.12, 0.34], [0.2, 0.12, 0.34]]) add(g, Co(r, h, 4), 0xfffaf0, [x, 0.42 - h / 2, 0.1], [PI, PI / 4, 0]);
    for (const x of [-0.45, -0.15, 0.15, 0.45]) add(g, Co(0.12, 0.3, 4), 0xfffaf0, [x, -0.46 + 0.15, 0.12], [0, PI / 4, 0]);
    return g;
  },
  boulder() {
    const g = new THREE.Group();
    add(g, Bx(1.3, 1.0, 1.1), 0x9b7b5b, [0, 0, 0], [0.3, 0.5, 0.2], { flat: true });
    add(g, Bx(0.8, 0.7, 0.8), 0x8a6b4d, [0.55, 0.35, 0.1], [0.6, 0.2, 0.5], { flat: true });
    add(g, Bx(0.5, 0.45, 0.5), 0xae8f6c, [-0.6, -0.35, 0.3], [0.2, 0.9, 0.3], { flat: true });
    for (const [x, y] of [[-0.9, 0.5], [0.9, -0.5], [0.2, -0.75]]) add(g, Bx(0.18, 0.18, 0.18), 0xc3a582, [x, y, 0.4], [0.5, 0.5, 0]);
    return g;
  },
  shield() {
    const g = new THREE.Group();
    add(g, Bx(1.42, 1.25, 0.16), 0xc99222, [0, 0.2, -0.04], [0, 0, 0], GOLD);
    add(g, Bx(1.0, 1.0, 0.16), 0xc99222, [0, -0.45, -0.04], [0, 0, PI / 4], GOLD);
    add(g, Bx(1.22, 1.05, 0.2), 0x4a8cff, [0, 0.22, 0]);
    add(g, Bx(0.84, 0.84, 0.2), 0x4a8cff, [0, -0.38, 0], [0, 0, PI / 4]);
    add(g, Bx(0.2, 0.9, 0.08), 0xffd34d, [0, 0.0, 0.12], [0, 0, 0], GOLD);
    add(g, Bx(0.75, 0.2, 0.08), 0xffd34d, [0, 0.15, 0.12], [0, 0, 0], GOLD);
    return g;
  },
  wind() {
    const g = new THREE.Group();
    for (const [y, len, x] of [[0.45, 1.3, -0.1], [0, 1.6, 0.05], [-0.45, 1.1, -0.2]]) add(g, Cy(0.13, len), 0x6fe3ff, [x, y, 0], [0, 0, PI / 2]);
    add(g, Sp(0.36), 0xffffff, [0.85, 0.12, 0]);

function snap(group, size, o = {}) {
  const scene = new THREE.Scene();
  scene.add(new THREE.HemisphereLight(0xffffff, 0x8f84b8, 1.55));
  const key = new THREE.DirectionalLight(0xffffff, 2.1); key.position.set(3, 5, 6); scene.add(key);
  const rim = new THREE.DirectionalLight(0xfff2d8, 0.7); rim.position.set(-5, 1.5, -2); scene.add(rim);
  group.rotation.set(o.pitch ?? 0.28, o.yaw ?? -0.5, o.roll ?? 0, 'YXZ');
  scene.add(group);
  group.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(group);
  const c = box.getCenter(new THREE.Vector3()), sz = box.getSize(new THREE.Vector3());
  group.position.sub(c);
  const fov = 24;
  const r = Math.max(sz.x, sz.y) * 0.5 * (o.pad ?? 1.08);
  const cam = new THREE.PerspectiveCamera(fov, 1, 0.1, 200);
  cam.position.set(0, 0, r / Math.tan(fov * PI / 360) + sz.z / 2);
  cam.lookAt(0, 0, 0);
  renderer.setSize(size, size, false);
  renderer.setClearColor(0x000000, 0);
  renderer.render(scene, cam);
  return renderer.domElement.toDataURL('image/png');
}

function partMesh(p) {
  const [sx, sy, sz] = p.size;
  let geo;
  if (p.mesh === 'Sphere') { geo = new THREE.SphereGeometry(0.5, 20, 14); geo.scale(sx, sy, sz); }
  else if (p.cls === 'WedgePart') geo = wedgeGeometry(sx, sy, sz);
  else if (p.shape === 'Ball') geo = new THREE.SphereGeometry(Math.min(sx, sy, sz) / 2, 22, 16);
  else if (p.shape === 'Cylinder') { const r = Math.min(sy, sz) / 2; geo = new THREE.CylinderGeometry(r, r, sx, 22); geo.rotateZ(PI / 2); }
  else geo = new THREE.BoxGeometry(sx, sy, sz);
  const color = new THREE.Color().setRGB(p.color[0], p.color[1], p.color[2], THREE.SRGBColorSpace);
  const m = new THREE.Mesh(geo, p.mat === 'Neon' ? new THREE.MeshBasicMaterial({ color }) : new THREE.MeshStandardMaterial({ color, roughness: 0.72, flatShading: p.mesh !== 'Sphere' && p.shape !== 'Ball', side: p.cls === 'WedgePart' ? THREE.DoubleSide : THREE.FrontSide, transparent: p.tr > 0, opacity: 1 - p.tr }));
  const c = p.cf;
  m.matrixAutoUpdate = false;
  m.matrix.set(c[3], c[4], c[5], c[0], c[6], c[7], c[8], c[1], c[9], c[10], c[11], c[2], 0, 0, 0, 1);
  return m;
}

function dogShot(w, h, yaw, pitch, zoom, focusHead) {
  const scene = new THREE.Scene();
  scene.add(new THREE.HemisphereLight(0xffffff, 0x88a070, 1.5));
  const sun = new THREE.DirectionalLight(0xfff4e0, 2.2); sun.position.set(4, 8, 3); scene.add(sun);
  const g = new THREE.Group();
  for (const p of dogData.parts) if (p.tr < 0.99) g.add(partMesh(p));
  scene.add(g); g.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(g);
  let c = box.getCenter(new THREE.Vector3());
  const sz = box.getSize(new THREE.Vector3());
  if (focusHead) {
    // cabeça = a ponta da frente e de cima do modelo
    const head = new THREE.Box3();
    for (const m of g.children) { const b = new THREE.Box3().setFromObject(m); const cc = b.getCenter(new THREE.Vector3()); if (cc.y > c.y + sz.y * 0.05 && cc.z < c.z - sz.z * 0.18) head.union(b); }
    if (!head.isEmpty()) c = head.getCenter(new THREE.Vector3());
  }
  const dist = Math.max(sz.x, sz.y, sz.z) * zoom;
  const cam = new THREE.PerspectiveCamera(30, w / h, 0.1, 300);
  cam.position.set(c.x + Math.sin(yaw) * dist * Math.cos(pitch), c.y + Math.sin(pitch) * dist, c.z + Math.cos(yaw) * dist * Math.cos(pitch));
  cam.lookAt(c);
  renderer.setSize(w, h, false);
  renderer.setClearColor(0x000000, 0);
  renderer.render(scene, cam);
  return renderer.domElement.toDataURL('image/png');
}

  ['map', 'MAP', ['#62e3da', '#25a9a1']],
  ['tower', 'BOSS', ['#b388ff', '#7b4be0']],
  ['gift', 'SHOP', ['#ff86c4', '#e8478f'], null, 'STARTER PACK'],
];
function menuButton(x, y, d, m, s, labelPx) {
  const [icon, label, colors, badge, ribbon] = m;
  const b = el('btn', { left: px(x), top: px(y), width: px(d), height: px(d), background: `linear-gradient(${colors[0]}, ${colors[1]})`, borderRadius: px(18 * s) });
  el('', { left: '50%', top: px(-6 * s), transform: 'translateX(-50%)' }, b, img(icon, d * 0.86));
  el('center', { left: px(2 * s), right: px(2 * s), bottom: px(3 * s), height: px(d * 0.3), borderRadius: px(999), background: 'rgba(20,12,40,0.55)' }, b, text(label, labelPx, '#fff', 'lucky', 0.2));
  if (badge) el('center badge', { right: px(-10 * s), top: px(-10 * s), minWidth: px(30 * s), height: px(30 * s), padding: `0 ${6 * s}px` }, b, text(badge, 16 * s, '#fff', 'lucky', 0.2));
  if (ribbon) el('center btn', { left: '50%', top: px(-16 * s), transform: 'translateX(-50%) rotate(-4deg)', padding: `${2 * s}px ${8 * s}px`, borderRadius: px(8 * s), background: 'linear-gradient(#ffe066,#ffb81c)', boxShadow: `0 ${2 * s}px 0 ${INK}` }, b, text(ribbon, 11 * s, '#fff', 'lucky', 0.22));
}
function abilities(cx, bottom, d, s, labelPx) {
  const list = [['fang', 'BITE', '1', ['#ff7b7b', '#e0393f']], ['boulder', 'QUAKE', '2', ['#c79a6a', '#8f6439'], 3], ['shield', 'GUARD', '3', ['#7fb0ff', '#3d73e0']], ['wind', 'DODGE', 'Q', ['#7ff0ff', '#2fb8d6']]];
  const gap = 18 * s, total = list.length * d + (list.length - 1) * gap;
  list.forEach(([icon, label, keyName, colors, cd], i) => {
    const x = cx - total / 2 + i * (d + gap), y = H - bottom - d - labelPx - 6 * s;
    const b = el('btn center', { left: px(x), top: px(y), width: px(d), height: px(d), borderRadius: '50%', background: `radial-gradient(circle at 50% 30%, ${colors[0]}, ${colors[1]})`, overflow: 'visible' }, stage, img(icon, d * 0.74));
    if (cd) {
      el('center', { left: 0, top: 0, right: 0, bottom: 0, borderRadius: '50%', background: 'conic-gradient(rgba(15,10,30,0.72) 0 62%, rgba(0,0,0,0) 62% 100%)' }, b, text(cd + 's', d * 0.3, '#fff', 'lucky', 0.2));
    }
    if (!PHONE) el('center btn', { right: px(-6 * s), bottom: px(-4 * s), width: px(28 * s), height: px(28 * s), borderRadius: px(8 * s), background: '#2a2244', boxShadow: `0 ${2 * s}px 0 ${INK}` }, b, text(keyName, 15 * s, '#fff', 'lucky', 0.2));
    el('center', { left: px(x - 20 * s), top: px(y + d + 4 * s), width: px(d + 40 * s) }, stage, text(label, labelPx, '#fff', 'lucky', 0.22));
  });
}
function toast(cy, s, icon, msg, color) {
  const p = el('panel center' + (TH.glow ? ' glow' : ''), { left: '50%', top: px(cy), height: px(40 * s), transform: 'translateX(-50%)', padding: `0 ${18 * s}px 0 ${50 * s}px`, borderRadius: px(999), background: bgOf('toast') });
  el('', { left: px(-2 * s), top: px(-8 * s) }, p, img(icon, 54 * s));
  p.insertAdjacentHTML('beforeend', text(msg, 16 * s, color, 'fred', 0.2));
}
function touchArc() {
  // botões do celular em volta do pulo (o jogo já faz isso; só ganham ícone 3D)
  const cx = 784, cy = 335, size = 48, r = 35 + 10 + size / 2;
  const arc = [[180, 'wind', 'RUN', ['#8dff6e', '#36b23f']], [140, 'person', 'HUMAN', ['#6fbaff', '#2f7de0']], [100, 'target', 'LOCK', ['#ff7b7b', '#e0393f']], [60, 'wing', 'FLY', ['#b388ff', '#7b4be0']]];
  for (const [deg, icon, label, colors] of arc) {
    const a = deg * PI / 180, x = cx + Math.cos(a) * r - size / 2, y = cy - Math.sin(a) * r - size / 2;
    const b = el('btn center', { left: px(x), top: px(y), width: px(size), height: px(size), borderRadius: '50%', background: `radial-gradient(circle at 50% 30%, ${colors[0]}, ${colors[1]})` }, stage, img(icon, size * 0.62, 'margin-top:-6px'));
    el('center', { left: 0, right: 0, bottom: px(2) }, b, text(label, 8.5, '#fff', 'lucky', 0.24));
  }
}

}

</script>
